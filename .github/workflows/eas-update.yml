name: EAS Update (OTA)

# Path-routed: this workflow handles JS-only changes, eas-build.yml
# handles native changes. The two path lists are complementary so
# every push fires roughly one of the two (a mixed JS+native push
# fires both, which is fine — the APK rebuild covers it eventually).

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - Github-APK-Transition-snow
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'android/**'
      - 'ios/**'
      - 'assets/icon.png'
      - 'assets/adaptive-icon.png'
      - 'assets/splash-icon.png'
      - '.github/workflows/**'
      - 'README.md'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Apply temporary bounce-fix patch to Game.ts
        run: node scripts/apply-bounce-fix-patch.mjs
      - name: Regenerate html-bundle.ts (CRITICAL for OTA correctness)
        run: npm run web:build
        env:
          NODE_ENV: production
      - name: Publish OTA update
        run: |
          MSG="$(git log -1 --pretty=%s | head -c 100)"
          npx eas-cli@latest update \
            --branch preview \
            --platform android \
            --non-interactive \
            --message "$MSG"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.SNOWBOARD || secrets.SNOW }}
          NODE_ENV: production
      # CRITICAL: Re-link channel "preview" to branch "preview" on every
      # publish. The channel had been pinned to a stale update group from
      # May 3 — every push to the branch since then was invisible to the
      # channel, so the device's checkForUpdateAsync kept returning the
      # stale May-3 update (or "up to date" when its createdAt was older
      # than the embedded build). The cloud-build flow used to set this
      # link automatically; we lost that when we switched to raw expo
      # prebuild + Gradle. Running this on every publish is idempotent
      # and cheap, and guards against the link getting un-set in the
      # future.
      - name: Re-link channel preview → branch preview
        run: |
          npx eas-cli@latest channel:edit preview \
            --branch preview \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.SNOWBOARD || secrets.SNOW }}
      - name: Diagnose channel + branch state
        run: |
          echo '=== eas channel:view preview (post-relink) ==='
          npx eas-cli@latest channel:view preview --json --non-interactive || true
          echo ''
          echo '=== eas update:list --branch preview ==='
          npx eas-cli@latest update:list --branch preview --limit 5 --json --non-interactive || true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.SNOWBOARD || secrets.SNOW }}
