name: EAS Update (OTA)

on:
  push:
    branches:
      - main
      - 'claude/android-snowboarding-game-UHUPI'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g eas-cli
      - run: npm install
      - run: npm run web:build
      - name: Publish OTA update
        # --platform android: app.json only declares android, but
        # eas update --auto otherwise still asks expo-cli to export ios
        # and fails (no ios entry in the bundler's platforms list).
        run: eas update --auto --platform android --non-interactive
        # Token name flexibility: prefer EXPO_TOKEN, fall back to the
        # SNOWBOARD / SNOW secret names already in this repo.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.SNOWBOARD || secrets.SNOW }}
