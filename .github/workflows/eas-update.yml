name: EAS Update (OTA)

# DISABLED ON THIS BRANCH ON PURPOSE.
#
# main is behind the live release line (claude/repo-gameplay-review-loq9rq,
# draft PR #64). Every installed APK listens to the single "preview" EAS
# channel, so publishing from this branch would roll every player back to
# old code. The real publishing workflow (tests, smoke, size budget,
# "never go backwards" ancestry guard, delivery check) lives on the live
# line and takes over when that line is merged here.
#
# When merging the live line into main, take the live line's version of
# .github/workflows/eas-update.yml and eas-build.yml.

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::OTA publishing is disabled on this branch: it is older than the live release line and would downgrade installed players. Publish from claude/repo-gameplay-review-loq9rq (or from main after that line is merged)."
          exit 1
