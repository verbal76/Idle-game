name: EAS Update (OTA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - Github-APK-Transition-snow
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'android/**'
      - 'ios/**'
      - 'assets/icon.png'
      - 'assets/adaptive-icon.png'
      - 'assets/splash-icon.png'
      - '.github/workflows/**'
      - 'README.md'
      - 'MOBILE_GAME_DEV_RULES.md'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Unit tests (block the OTA on any failure)
        run: npm test
      - name: Apply temporary bounce-fix patch to Game.ts
        run: node scripts/apply-bounce-fix-patch.mjs
      - name: Regenerate html-bundle.ts (CRITICAL for OTA correctness)
        run: npm run web:build
        env:
          NODE_ENV: production
      - name: Verify html-bundle.ts has fresh CSS
        run: |
          BUNDLE='src/__generated__/html-bundle.ts'
          echo "=== Bundle size ==="
          wc -c "$BUNDLE"
          echo ""
          echo "=== gear-btn CSS rules (occurrence count) ==="
          echo "transparent (new chromeless): $(grep -o 'background:transparent' "$BUNDLE" | wc -l)"
          echo "#142038d1 (old chrome):        $(grep -o 'background:#142038d1' "$BUNDLE" | wc -l)"
          echo ""
          echo "=== gear-btn rule excerpt (first match) ==="
          grep -o '\.gear-btn{[^}]*}' "$BUNDLE" | head -1
      - name: Publish OTA update
        run: |
          MSG="$(git log -1 --pretty=%s | head -c 100)"
          npx eas-cli@latest update \
            --branch preview \
            --platform android \
            --non-interactive \
            --message "$MSG"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.SNOWBOARD || secrets.SNOW }}
          NODE_ENV: production
      - name: Re-link channel preview → branch preview
        run: |
          npx eas-cli@latest channel:edit preview \
            --branch preview \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.SNOWBOARD || secrets.SNOW }}
