name: EAS Update (OTA)

# Path-routed: this workflow handles JS-only changes, eas-build.yml
# handles native changes. The two path lists are complementary so
# every push to main fires roughly one of the two (a mixed JS+native
# push fires both, which is fine — the APK rebuild covers it
# eventually).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'android/**'
      - 'ios/**'
      - 'assets/icon.png'
      - 'assets/adaptive-icon.png'
      - 'assets/splash-icon.png'
      - '.github/workflows/**'
      - 'README.md'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g eas-cli
      - run: npm install
      - run: npm run web:build
        env:
          NODE_ENV: production
      - name: Publish OTA update
        # Publish to the EAS branch literally named "preview" so the
        # channel "preview" (declared in eas.json's preview build profile)
        # picks up the update on the installed APK. Message is the head
        # commit subject so the EAS dashboard correlates updates with
        # specific commits.
        run: |
          MSG="$(git log -1 --pretty=%s | head -c 100)"
          eas update \
            --branch preview \
            --platform android \
            --non-interactive \
            --message "$MSG"
        env:
          # Token name flexibility: prefer EXPO_TOKEN, fall back to the
          # SNOWBOARD / SNOW secret names already in this repo. NODE_ENV
          # set so eas-cli's underlying Metro bundling runs in production
          # mode (minified + dead-code-stripped).
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.SNOWBOARD || secrets.SNOW }}
          NODE_ENV: production
