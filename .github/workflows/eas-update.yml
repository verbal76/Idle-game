name: EAS Update (OTA)

# EXPLICITLY AUTHORIZED PUBLISHING ONLY.
#
# No push, pull request, merge, tag, version bump or documentation change can publish an
# OTA: this workflow has NO automatic trigger. An OTA is published only when the owner
# runs it by hand (Actions > EAS Update (OTA) > Run workflow) with:
#   source_sha  the exact 40-character commit approved for release
#   confirm     the word  publish-ota
# and the job then waits for the `production-release` environment (add required reviewers
# and restrict deployment branches there: Settings > Environments; docs/release-authorization.md).
#
# Source integrity: the job checks out that exact immutable SHA, confirms HEAD == the approved
# SHA, that it is on the authoritative line and contains the authoritative baseline, and every
# later step uses the approved SHA (never the moving branch). Existing safeguards are kept:
# lint, unit tests, smoke, page-size budget, placeholder refusal, "never go backwards",
# channel re-link and the delivery verification. docs/release-authorization.md

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Approved source commit (full 40-character SHA)'
        required: true
        type: string
      confirm:
        description: 'Type publish-ota to authorize publishing this commit as an OTA'
        required: true
        type: string
      ota_label:
        description: 'Optional OTA label, e.g. "OTA #84" (default: taken from the commit subject)'
        required: false
        type: string

permissions:
  contents: read

# One publish at a time across ALL sources (they share the live channel), and never
# cancelled: a cancelled run would drop a release.
concurrency:
  group: eas-update-preview
  cancel-in-progress: false

jobs:
  update:
    # Skipped (0 runner minutes) unless the owner typed the confirmation.
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'publish-ota'
    environment: production-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPROVED_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Approved SHA is a full commit id
        run: |
          printf '%s' "$APPROVED_SHA" | grep -qE '^[0-9a-f]{40}$' || { echo "::error::source_sha must be a full 40-character lowercase commit SHA"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}   # the exact immutable commit, not a branch
          fetch-depth: 0                  # full history for the source and 'never go backwards' guards
      - name: Verify the approved source (exact SHA, authoritative history)
        run: node scripts/verify-approved-source.mjs "$APPROVED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Exactly the dependency tree in package-lock.json (reproducible).
      - run: npm ci --no-audit --no-fund
      - name: Lint (promise mistakes etc.; blocks the OTA)
        run: npm run lint
      - name: Unit tests (block the OTA on any failure)
        run: npm test
      - name: Regenerate html-bundle.ts (CRITICAL for OTA correctness)
        run: npm run web:build
        env:
          NODE_ENV: production
      - name: Smoke test the built game (block the OTA on any failure)
        # Same headless end-to-end check CI runs: boots dist/index.html
        # in Chrome and rides both modes before anything is published.
        run: npm run test:smoke
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: The embedded game is real (not the git-ignored placeholder)
        run: |
          if grep -q '__PLACEHOLDER__' src/__generated__/html-bundle.ts; then
            echo "::error::src/__generated__/html-bundle.ts is still the placeholder; web:build did not produce the game. Refusing to publish a blank app."
            exit 1
          fi
          test "$(wc -c < src/__generated__/html-bundle.ts)" -gt 1000000
      - name: Page size budget
        # The WebView receives the whole game as one HTML string; the
        # Android Binder channel that carries it fails (black screen)
        # somewhere above ~10 MB (see MusicPlayer.ts). Fail well before.
        run: |
          SIZE=$(wc -c < dist/index.html)
          echo "dist/index.html: $SIZE bytes (budget 7500000)"
          if [ "$SIZE" -gt 7500000 ]; then echo "::error::Page bundle $SIZE bytes is over the 7.5 MB budget"; exit 1; fi
      - name: Never go backwards (refuse to replace the live update with older code)
        # The live update must be an ancestor of this commit. Stops a push
        # from a stale branch (or a re-run of an old commit) downgrading
        # every player.
        run: |
          PROJECT="$(node -p "require('./app.json').expo.extra.eas.projectId")"
          RUNTIME="$(node -p "require('./app.json').expo.version")"
          CHANNEL="$(node -p "require('./app.json').expo.updates.requestHeaders['expo-channel-name']")"
          curl -sS -m 30 "https://u.expo.dev/$PROJECT" \
            -H "expo-platform: android" -H "expo-runtime-version: $RUNTIME" \
            -H "expo-channel-name: $CHANNEL" -H "expo-protocol-version: 1" \
            -H "accept: multipart/mixed" -o "$RUNNER_TEMP/live.txt" || true
          LIVE="$(grep -oE '"commit":"[0-9a-f]{40}"' "$RUNNER_TEMP/live.txt" | head -1 | grep -oE '[0-9a-f]{40}' || true)"
          if [ -z "$LIVE" ]; then echo "No commit stamped on the live update; nothing to compare."; exit 0; fi
          echo "Live update was built from $LIVE"
          if ! git cat-file -e "$LIVE^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$LIVE" "$APPROVED_SHA"; then
            echo "::error::$APPROVED_SHA does not contain the live update's commit $LIVE; publishing would roll players back. Merge the live line first."
            exit 1
          fi
          # OTA compatibility: nothing between the live update and this commit may change the native
          # build (the route script also demands a runtime bump for native-capability changes).
          ROUTE_IGNORE_MARKER=1 GITHUB_EVENT_NAME=push GITHUB_SHA="$APPROVED_SHA" BEFORE="$LIVE" GITHUB_OUTPUT="$RUNNER_TEMP/route.out" bash .github/scripts/release-route.sh
          if grep -q '^native=true' "$RUNNER_TEMP/route.out"; then
            echo "::error::Changes since the live update ($LIVE) alter the native build: this cannot ship as an OTA. Build and install the APK first."
            exit 1
          fi
      - name: Publish OTA update
        # OTA_* vars are stamped into this update's manifest by
        # app.config.js (extra.ota) so the in-game Build / Update Info
        # can show the source commit and OTA name it is running.
        run: |
          set -o pipefail   # a failed publish must fail the step despite | tee
          SUBJECT="$(git log -1 --pretty=%s "$APPROVED_SHA")"
          # Cut by characters (not bytes, which can split a character).
          MSG="$(printf '%s' "$SUBJECT" | node -e 'const a=[...require("fs").readFileSync(0,"utf8").trim()];process.stdout.write(a.length>100?a.slice(0,99).join("")+"…":a.join(""))')"
          export OTA_COMMIT="$APPROVED_SHA"
          export OTA_MESSAGE="$SUBJECT"
          export OTA_LABEL="${{ inputs.ota_label }}"
          [ -n "$OTA_LABEL" ] || OTA_LABEL="$(git log -1 --pretty=%s "$APPROVED_SHA" | grep -oE 'OTA #[0-9]+' | tail -1 || true)"
          export OTA_LABEL
          export OTA_RUN="$GITHUB_RUN_NUMBER"
          export OTA_BRANCH="$(node -p "require('./authoritative.json').authoritativeLine")"
          npx eas-cli@24.10.0 update \
            --branch preview \
            --platform android \
            --non-interactive \
            --message "$MSG" 2>&1 | tee "$RUNNER_TEMP/eas-update.log"
          ANDROID_ID="$(grep -oE 'Android update ID +[0-9a-f-]{36}' "$RUNNER_TEMP/eas-update.log" | grep -oE '[0-9a-f-]{36}' | head -1)"
          if [ -z "$ANDROID_ID" ]; then echo "::error::Could not read the Android update ID from eas update output"; exit 1; fi
          echo "ANDROID_UPDATE_ID=$ANDROID_ID" >> "$GITHUB_ENV"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.SNOWBOARD || secrets.SNOW }}
          NODE_ENV: production
      - name: Re-link channel preview → branch preview
        run: |
          npx eas-cli@24.10.0 channel:edit preview \
            --branch preview \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.SNOWBOARD || secrets.SNOW }}
      - name: Verify the installed APK will receive this update
        # Asks the update server exactly what an installed APK asks
        # (its project, runtime version and channel header, all read
        # from app.json - the same values prebuild bakes into the APK)
        # and requires the answer to be the update just published,
        # carrying this commit. Fails the run otherwise.
        run: |
          node -e "const e=require('./app.json').expo; if (!e.runtimeVersion || e.runtimeVersion.policy!=='appVersion') { console.error('runtimeVersion policy changed; update this check'); process.exit(1); }"
          PROJECT="$(node -p "require('./app.json').expo.extra.eas.projectId")"
          RUNTIME="$(node -p "require('./app.json').expo.version")"
          CHANNEL="$(node -p "require('./app.json').expo.updates.requestHeaders['expo-channel-name']")"
          echo "Asking u.expo.dev/$PROJECT as android / runtime $RUNTIME / channel $CHANNEL for update $ANDROID_UPDATE_ID"
          for i in $(seq 1 12); do
            curl -sS -m 30 "https://u.expo.dev/$PROJECT" \
              -H "expo-platform: android" \
              -H "expo-runtime-version: $RUNTIME" \
              -H "expo-channel-name: $CHANNEL" \
              -H "expo-protocol-version: 1" \
              -H "accept: multipart/mixed" -o "$RUNNER_TEMP/manifest.txt" || true
            SERVED="$(grep -oE '"id":"[0-9a-f-]{36}"' "$RUNNER_TEMP/manifest.txt" | head -1 | grep -oE '[0-9a-f-]{36}' || true)"
            echo "attempt $i: served update ${SERVED:-none}"
            if [ "$SERVED" = "$ANDROID_UPDATE_ID" ] && grep -q "$APPROVED_SHA" "$RUNNER_TEMP/manifest.txt"; then
              echo "OK: runtime $RUNTIME / channel $CHANNEL now serves $ANDROID_UPDATE_ID (commit $APPROVED_SHA)"
              grep -oE '"(runtimeVersion|createdAt)":"[^"]*"' "$RUNNER_TEMP/manifest.txt" | head -2
              exit 0
            fi
            sleep 10
          done
          echo "::error::The update server did not serve $ANDROID_UPDATE_ID to runtime $RUNTIME / channel $CHANNEL"
          head -c 2000 "$RUNNER_TEMP/manifest.txt"
          exit 1
