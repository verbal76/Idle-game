name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/android-snowboarding-game-UHUPI'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK at repo root
        run: cp android/app/build/outputs/apk/debug/app-debug.apk boarder-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: boarder-debug-apk
          path: boarder-debug.apk
          retention-days: 90
