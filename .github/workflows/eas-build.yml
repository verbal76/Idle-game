name: APK Build (GitHub-hosted)

# GitHub-hosted Gradle build for snow. Replaces the previous
# `eas build --local` approach (which kept failing on prebuild
# / icon path / expo-doctor) with the same recipe that already
# produces working APKs for the endless-escape sister project:
# run `expo prebuild` on the runner, build with Gradle, sign
# with the Expo-template debug keystore, publish to a GitHub
# Release.
#
# Why assembleRelease (not assembleDebug): release builds bake
# the JS bundle into the APK and disable Metro/dev-server
# lookup, so the APK runs fully standalone. assembleDebug would
# still try to fetch JS from `npx expo start` at runtime and
# show a red error screen when no Metro is reachable.
#
# Keystore note: the Expo template's debug keystore signs the
# release APK. This is a DIFFERENT key from the EAS-managed
# keystore that signed previous cloud builds, so existing
# testers must UNINSTALL their current build before installing
# the first APK from this workflow (Android update flow rejects
# a different signature). Profile / IndexedDB / localStorage
# data is lost on that one-time reinstall — accepted trade-off
# for getting a working build pipeline. Subsequent debug-keystore
# APKs install as normal updates and preserve data.
#
# OTA updates flow through eas-update.yml unchanged. EAS Update
# matches on project ID + runtimeVersion + channel, not signing
# key, so OTAs land on the debug-signed APK identically to how
# they landed on the EAS-signed cloud builds.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      # Migration line (held, not live): manual dispatch is not available to
      # the automation here, so a commit whose message contains [build-apk]
      # builds an APK (release-route.sh). Artifact only: no GitHub Release.
      - claude/hold-api36-migration
      # Integration candidate (migration + save backup + diagnostics + naming).
      # Same rules: artifact only, never a Release, never an OTA.
      - claude/hold-candidate-next
    # No `paths:` filter: pushes to hold/candidate branches are gated by the job-level `if` below
    # (a job skipped by `if` uses no runner minutes), so editing docs or this workflow costs nothing.

permissions:
  # softprops/action-gh-release needs write access to publish the
  # release + upload the APK as an asset.
  contents: write

# main: never cancelled (a later OTA-only push must not drop a native change that was still
# building). Hold / candidate branches: a newer [build-apk] push supersedes the older run.
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  route:
    # One-at-a-time rule: decides whether this push is native (APK) or
    # JS-only (OTA). eas-build.yml and eas-update.yml run the same script
    # on the same commit range, so a push can never start both.
    # Budget rule (docs/actions-budget.md): on branches other than main a build is
    # wanted only when the commit message says [build-apk]; otherwise this job (and
    # the build) is skipped and costs no minutes.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]')
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.route.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: route
        run: bash .github/scripts/release-route.sh
        env:
          BEFORE: ${{ github.event.before }}

  build:
    needs: route
    # Only pushes that change the native build (not e.g. devDependencies).
    if: needs.route.outputs.native != 'false' && needs.route.result == 'success'
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The runner image already has the Android SDK (ANDROID_HOME). The action's
      # default package list asks for the retired 'tools' package, which current
      # cmdline-tools reject ("Failed to find package 'tools'"), so install nothing
      # here; the exact components are installed after prebuild, below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install dependencies (exactly package-lock.json)
        run: npm ci --no-audit --no-fund

      # Generates src/__generated__/html-bundle.ts (the singlefile JS/HTML the
      # WebView loads) AND assets/icon.png + adaptive-icon.png
      # (read by expo prebuild via app.json). Both (and src/__generated__)
      # are .gitignored generated outputs; we materialise them on the runner here
      # so prebuild + Gradle find them in the workspace.
      # The versionCode is this workflow's run number: monotonically
      # increasing and never reused. It is INTERNAL metadata (About shows it
      # as "Android build (versionCode)"); the public name and file name come
      # from release.json (v<number>, docs/release-naming.md).
      # Done before the web build so the bundle's own build stamp matches.
      - name: Stamp versionCode = run number (not committed)
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android.versionCode = ${{ github.run_number }};
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "
          grep -n '"versionCode"\|"version"\|"package"' app.json

      - name: Unit tests (block the APK on any failure)
        run: |
          npm test
          python3 -m unittest discover -s scripts/tests

      - name: Build web bundle + icons
        run: npm run web:build

      # The WebView receives the whole game as one HTML string; the Android Binder
      # channel that carries it fails (black screen) somewhere above ~10 MB.
      - name: Page size budget
        run: |
          SIZE=$(wc -c < dist/index.html)
          echo "dist/index.html: $SIZE bytes (budget 7500000)"
          if [ "$SIZE" -gt 7500000 ]; then echo "::error::Page bundle $SIZE bytes is over the 7.5 MB budget"; exit 1; fi

      - name: Generate android/ project (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: '1'

      # Exactly the platform / build-tools / NDK the generated project asks for
      # (read from android/), plus accepted licences, so Gradle never stalls on a
      # download prompt and a newer compileSdk than the image carries still works.
      - name: Install the Android SDK components this build needs
        run: bash .github/scripts/install-android-components.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Keyed on the dependency lock, NOT on the generated android/ files: those contain the
          # per-run versionCode, so the old key changed every run, never hit, and saved a new
          # ~1.5 GB cache every time (billed upload time + cache-quota churn).
          key: gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-

      # assembleRelease bundles the JS into the APK and signs with
      # the Expo-template's debug keystore (release.signingConfig
      # defaults to signingConfigs.debug in the prebuild output),
      # so no GitHub Secrets / upload-key setup is needed.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          # Public names come only from release.json (docs/release-naming.md).
          node scripts/release-info.mjs --github >> "$GITHUB_OUTPUT"
          echo "name=$(node scripts/release-info.mjs --github | sed -n 's/^apk=//p')" >> "$GITHUB_OUTPUT"

      - name: Describe this build
        id: ver
        run: |
          echo "ota=source ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}, versionCode ${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # The release GATE (scripts/inspect-apk.py): fails the build, and so blocks
      # the artifact and any release, when a 64-bit native library is not 16 KB
      # aligned, zipalign -P 16 rejects the APK, targetSdk < 36, the package id is
      # not com.hotatticgames.snow, or a blocked permission is present. The report
      # is uploaded even on failure.
      - name: Gate the APK (16 KB alignment, target SDK, package id, permissions)
        run: |
          set -o pipefail
          MANIFEST=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*release*' -path '*merged_manifest*' -print -quit || true)
          python3 scripts/inspect-apk.py "${{ steps.apk.outputs.path }}" "$MANIFEST" | tee apk-report.txt

      # A public version number is never reused for a different binary:
      # bump release.json before shipping a new playable build.
      - name: Refuse to reuse a public version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TAG="${{ steps.apk.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists. Bump publicVersion in release.json (see docs/release-naming.md)."
            exit 1
          fi

      - name: Rename APK for upload and write its SHA-256
        id: sha
        run: |
          cp "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.name }}"
          sha256sum "${{ steps.apk.outputs.name }}" | tee "${{ steps.apk.outputs.name }}.sha256"
          echo "sha256=$(cut -d' ' -f1 "${{ steps.apk.outputs.name }}.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          if-no-files-found: error

      - name: Upload the APK inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-report-${{ github.run_number }}
          path: apk-report.txt

      # Auto-publish a GitHub Release on every push so testers
      # always have a stable URL for the latest build. Manual
      # (workflow_dispatch) runs skip this and just leave the APK
      # as a workflow artifact you can download from the run page.
      - name: Publish GitHub Release
        # Releases are public distribution: main only. Migration builds are
        # workflow artifacts only.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ${{ steps.apk.outputs.title }}
          body: |
            ## Install: download `${{ steps.apk.outputs.name }}` below

            1. Download the APK.
            2. On your Android device, allow "install from unknown sources" for your browser / file manager.
            3. Open the downloaded APK to install.
            4. If Android refuses to update over an existing install (different signing key), uninstall first. Use Settings > Back up first: an uninstall erases local saves.

            After installing, the app keeps itself current over the air; the public version shown in About can stay the same while the OTA revision advances.

            ### Provenance (internal)
            - Public version: ${{ steps.apk.outputs.version }}
            - SHA-256: `${{ steps.sha.outputs.sha256 }}`
            - Source commit: `${{ github.sha }}`
            - OTA revision at build: **${{ steps.ver.outputs.ota }}**
            - Android versionCode: from `app.json` (see About > Copy diagnostics)
            - CI run: #${{ github.run_number }}
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
