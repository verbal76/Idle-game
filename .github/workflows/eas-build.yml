name: APK Build (GitHub-hosted)

# DISABLED ON THIS BRANCH ON PURPOSE (see eas-update.yml here).
# An APK built from this stale branch would become the newest GitHub
# Release and ship old native + embedded code. The real APK workflow
# lives on the live release line and takes over when it is merged.

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::APK builds are disabled on this branch: it is older than the live release line. Build from the live line, or from main after it is merged."
          exit 1
